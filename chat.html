<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Bir Tawil</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-wrapper {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .profile-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
    }
    .avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      margin-right: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .profile-link:hover .avatar-img {
      transform: scale(1.05);
      border-color: var(--primary);
    }
    .user-info .name {
      font-weight: 800;
      font-size: 18px;
      color: var(--text);
      transition: color 0.2s ease;
      text-transform: lowercase;
    }
    .profile-link:hover .name {
      color: var(--primary);
    }
    .user-info .status {
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: lowercase;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
    }
    .chat-box {
      flex: 1;
      padding: 32px;
      padding-bottom: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafafa;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 65%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-out forwards;
      text-transform: lowercase;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.bot {
      background: #ffffff;
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .msg.user {
      background: var(--primary);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 18px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .options-container {
      padding: 20px 32px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }
    .option-btn {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      text-transform: lowercase;
    }
    .option-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    @media (max-width: 768px) {
      .chat-header { padding: 12px 16px; }
      .chat-box { padding: 16px; }
      .options-container {
        padding: 16px;
        grid-template-columns: 1fr;
      }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <a href="profile.html" class="profile-link" title="View Profile">
        <img class="avatar-img" id="avatarImg" src="birtawilpfp.jpeg" alt="Bir Tawil Profile">
        <div class="user-info">
          <div class="name" id="mainTitle">bir tawil</div>
          <div class="status" id="pageStatus"><span class="status-dot"></span> active now</div>
        </div>
      </a>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="options-container" id="optionsBox"></div>
  </div>

  <script>

window.onload=function(){
  showScene("start");
};

function scrollToBottom(){
  chatBox.scrollTop=chatBox.scrollHeight;
}

function appendMessage(text,sender){
  const msg=document.createElement("div");
  msg.className="msg "+sender;
  msg.textContent=text;
  chatBox.appendChild(msg);
  scrollToBottom();
}

function showTypingIndicator(){
  const indicator=document.createElement("div");
  indicator.className="typing-indicator";
  indicator.id="typingIndicator";
  indicator.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatBox.appendChild(indicator);
  scrollToBottom();
}

function removeTypingIndicator(){
  const indicator=document.getElementById("typingIndicator");
  if(indicator) indicator.remove();
}

function showScene(key){
  const scene=scenes[key];
  if(!scene) return;
  
  scene.bot.forEach(function(line){
    appendMessage(line,"bot");
  });
  
  renderOptions(scene.options);
}

function renderOptions(options){
  optionsBox.innerHTML="";
  if(!options || options.length===0) return;
  
  options.forEach(function(option){
    const button=document.createElement("button");
    button.className="option-btn";
    button.textContent=option[0];
    button.onclick=function(){
      choose(option[0],option[1]);
    };
    optionsBox.appendChild(button);
  });
  scrollToBottom();
}

function choose(text,next){
  appendMessage(text,"user");
  optionsBox.innerHTML="";
  showTypingIndicator();
  setTimeout(function(){
    removeTypingIndicator();
    showScene(next);
  }, 520);
}
</script>
</body>
</html>
